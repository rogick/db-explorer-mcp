version: 2

project_name: db-explorer-mcp

before:
  hooks:
    - go mod tidy

builds:
  - id: db-explorer-mcp
    main: ./cmd/db-explorer-mcp
    binary: db-explorer-mcp
    env:
      - CGO_ENABLED=0
    goos:
      - windows
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/rogick/db-explorer-mcp/pkg/mcp.Version={{.Version}}

  - id: db-explorer-manager
    main: ./cmd/db-explorer-manager
    binary: db-explorer-manager
    env:
      - CGO_ENABLED=0
    goos:
      - windows
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: default
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^Merge '
